<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #F3F5F4; --panel: #FFFFFF; --ink: #16201E; --muted: #4A5754; --line: #D3DAD8;
    --soft-line: #E4E9E7; --field: #B9C4C1; --accent: #0E6658; --accent-dark: #0A4A40;
    --accent-ink: #FFFFFF; --tint: #E3F0ED; --warn-bg: #FBF1E2; --warn-ink: #5C3A08;
    --danger: #9B2C2C; --toast: #16201E; --toast-ink: #FFFFFF; --toast-link: #9FE0D3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121816; --panel: #1A2220; --ink: #E6ECEA; --muted: #A3B0AD; --line: #2E3936;
      --soft-line: #26302D; --field: #46534F; --accent: #5BC2AE; --accent-dark: #7FD3C2;
      --accent-ink: #0B1F1B; --tint: #193630; --warn-bg: #3A2C14; --warn-ink: #F0D6A8;
      --danger: #F08A8A; --toast: #E6ECEA; --toast-ink: #121816; --toast-link: #0E6658;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.55 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .wrap { max-width: 600px; margin: 0 auto; padding: 0 16px 64px; display: flex;
          flex-direction: column; gap: 20px; }
  .top { display: flex; justify-content: space-between; align-items: center; padding: 18px 0 6px;
         border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  h1 { margin: 0; font-size: 28px; line-height: 1.2; font-weight: 700; text-wrap: balance; }
  h1.big { font-size: 34px; line-height: 1.15; }
  p { margin: 0; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .stack-s { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .label { font-size: 13px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
           color: var(--muted); }
  .card { display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; background: var(--panel);
          border: 1px solid var(--line); border-radius: 12px; }
  .card-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
               flex-wrap: wrap; }
  .card-head > :first-child { min-width: 0; font-weight: 600; }
  .dates { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; color: var(--muted); }
  .note { padding: 14px 16px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-ink);
          font-size: 15px; }
  .done { padding: 16px 18px; border-radius: 12px; background: var(--tint); }
  .btn { font: 600 16px/1 'IBM Plex Sans', system-ui, sans-serif; min-height: 48px; padding: 0 22px;
         border-radius: 10px; border: 1px solid var(--accent); background: var(--accent);
         color: var(--accent-ink); cursor: pointer; }
  .btn:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .btn2 { font: 600 15px/1 'IBM Plex Sans', system-ui, sans-serif; min-height: 44px; padding: 0 18px;
          border-radius: 10px; border: 1px solid var(--field); background: var(--panel); color: var(--ink);
          cursor: pointer; }
  .btn2:hover { border-color: var(--ink); }
  .link { font: 500 15px/1.4 'IBM Plex Sans', system-ui, sans-serif; background: none; border: 0;
          padding: 10px 0; min-height: 44px; color: var(--accent); text-decoration: underline;
          cursor: pointer; text-align: left; }
  .link.danger { color: var(--danger); }
  .link.tight { padding: 4px 0; min-height: 32px; }
  button:disabled { opacity: .55; cursor: default; }
  input[type=text], input[type=email], textarea {
    font: 400 16px/1.5 'IBM Plex Sans', system-ui, sans-serif; width: 100%; min-height: 44px;
    padding: 8px 12px; border: 1px solid var(--field); border-radius: 10px; background: var(--panel);
    color: var(--ink); }
  textarea { min-height: 88px; resize: vertical; }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  label { font-size: 14px; font-weight: 600; }
  .lines { display: flex; flex-direction: column; border-top: 1px solid var(--soft-line); }
  .line { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start;
          padding: 8px 0; border-bottom: 1px solid var(--soft-line); }
  .line > :first-child { min-width: 0; font-size: 15px; padding-top: 4px; }
  .line .acts { display: flex; gap: 14px; flex-shrink: 0; }
  .drop { display: flex; flex-direction: column; gap: 12px; padding: 24px; border: 2px dashed var(--field);
          border-radius: 12px; background: var(--panel); align-items: flex-start; }
  .drop.over { border-color: var(--accent); background: var(--tint); }
  .file { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 12px;
          background: var(--panel); border: 1px solid var(--line); }
  .file.ok { background: var(--tint); border-color: transparent; }
  .file.err { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }
  .toast { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex;
           gap: 12px; justify-content: space-between; align-items: center; padding: 10px 16px;
           border-radius: 10px; background: var(--toast); color: var(--toast-ink); font-size: 15px; }
  .toast .link { color: var(--toast-link); flex-shrink: 0; }
  .alert { padding: 12px 16px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-ink); }
  .confirm { padding: 12px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-ink);
             display: flex; flex-direction: column; gap: 8px; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--field);
          border-top-color: var(--accent); border-radius: 50%; animation: s 1s linear infinite;
          vertical-align: -2px; margin-right: 6px; }
  @keyframes s { to { transform: rotate(360deg); } }
  .chip { font: 500 15px/1.2 'IBM Plex Sans', system-ui, sans-serif; min-height: 40px; padding: 8px 14px;
          border-radius: 20px; border: 1px solid var(--field); background: var(--panel); color: var(--ink);
          cursor: pointer; }
  .chip.add { border-style: dashed; border-color: var(--accent); color: var(--accent-dark); }
  .chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .stages { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .stage { display: flex; flex-direction: column; gap: 6px; min-width: 0; font-size: 12px; color: var(--muted); }
  .stage.on { color: var(--ink); font-weight: 600; }
  .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); }
  .count { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 15px; }
  .ex { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
  .bgline { display: flex; flex-direction: column; gap: 2px; padding: 8px 0; border-bottom: 1px solid var(--soft-line); }
  .bgline .q { font-size: 13px; color: var(--muted); }
  .tag { flex: none; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
         padding: 2px 8px; border-radius: 6px; background: var(--soft-line); color: var(--muted); }
  .tag.todo { background: var(--warn-bg); color: var(--warn-ink); }
  .tag.stronger { background: var(--accent); color: var(--accent-ink); }
  .tag.kept { background: var(--tint); color: var(--accent-dark); }
  .pick { display: flex; justify-content: space-between; gap: 12px; align-items: center; text-align: left;
          width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line);
          background: var(--panel); color: var(--ink); font: 400 16px/1.4 'IBM Plex Sans', system-ui, sans-serif;
          cursor: pointer; }
  .pick:hover { border-color: var(--ink); }
  .pick > span:first-child { min-width: 0; }
  .lsteps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .lstep { font-size: 12px; font-weight: 600; text-align: center; padding: 6px 2px; border-radius: 6px;
           background: var(--soft-line); color: var(--muted); }
  .lstep.on { background: var(--accent); color: var(--accent-ink); }
  .lstep.done { background: var(--tint); color: var(--accent-dark); }
  .big { font-size: 22px; line-height: 1.3; font-weight: 600; }
  h2 { margin: 0; font-size: 24px; line-height: 1.25; font-weight: 700; text-wrap: balance; }
  .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .card.strong { border: 2px solid var(--accent); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .tile { display: flex; flex-direction: column; gap: 4px; text-align: left; min-height: 72px; padding: 12px 14px;
          border-radius: 12px; border: 1px solid var(--field); background: var(--panel); color: var(--ink);
          font: 400 16px/1.3 'IBM Plex Sans', system-ui, sans-serif; cursor: pointer; }
  .tile .small { color: var(--muted); }
  .tile[aria-pressed=true] { border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
  .tile[aria-pressed=true] .small { color: var(--accent-ink); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">Career record</div><div class="small muted" id="saved">Saved as you go</div></div>
  <div id="alert" class="alert" role="alert" hidden></div>
  <main id="main" class="stack" aria-live="polite"></main>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + "s")}`;

const SCREENS = ["welcome", "upload", "check", "targets", "bg", "lines", "line", "more", "end",
                 "stopped", "bgdone", "record", "edu", "skills", "beyond", "later"];
// Where the on-screen Back goes from each screen when there is no browser
// history to go back through (for example, straight after a refresh). The
// background questions step back one question at a time instead.
const BACK = { upload: "welcome", check: "upload", targets: "check", record: "check" };
const STAGES = ["Your jobs", "Education", "Skills", "Beyond work", "Summary"];
let Q = null;              // the background questions' wording, from the server
let at = "";               // which background question is showing
let draft = null;          // an answer being typed, saved shortly after typing stops

let S = null;              // what the server says: jobs, contact, step
let screen = "welcome";
let ui = {};               // what's open on the page right now
let uploads = [];          // files read on the upload screen this visit

async function api(path, opts = {}) {
  const r = await fetch(path, { credentials: "same-origin",
    headers: opts.body && !(opts.body instanceof FormData) ? { "Content-Type": "application/json" } : {},
    ...opts });
  if (r.status === 401) { signIn(); throw new Error("signed out"); }
  const data = r.headers.get("content-type")?.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(typeof data.detail === "string" ? data.detail
    : "Something went wrong. Nothing was changed; try again.");
  return data;
}
const send = (method, path, body) => api(path, { method, body: JSON.stringify(body || {}) });

function say(msg) { const a = $("alert"); a.textContent = msg || ""; a.hidden = !msg; }

async function act(fn) {
  say("");
  try {
    const out = await fn();
    if (out && out.jobs) S = { ...S, ...out };
    render();
    return out;
  } catch (e) {
    if (e.message !== "signed out") say(e.message);
  }
}

// ---------------------------------------------------------------- moving

function go(next, { push = true, to = "", promo = false } = {}) {
  flush();
  screen = next; ui = { promo }; at = to || "";
  const st = { screen: next, at, promo, depth: (history.state?.depth || 0) + (push ? 1 : 0) };
  if (push) history.pushState(st, "", "#" + next);
  else history.replaceState(st, "", "#" + next);
  send("PUT", "/api/j/step", { screen: next, at }).catch(() => {});
  render();
  window.scrollTo(0, 0);
}
function back() {
  if ((history.state?.depth || 0) > 0) return history.back();
  const job = curJob();
  if (screen === "bg") return stepBack();
  if (screen === "lines") return jobBack(job);
  if (screen === "line") return go("lines", { to: job.key, push: false });
  if (screen === "more") return go("lines", { to: job.key, push: false });
  if (screen === "end") return go("more", { to: job.key, push: false });
  if (screen === "bgdone" || screen === "stopped") return go("record", { push: false });
  if (screen === "edu") { const last = jobByIndex(W().order.slice(-1)[0]);
    return last ? go("end", { to: last.key, push: false }) : go("record", { push: false }); }
  if (screen === "skills") return go("edu", { push: false });
  if (screen === "beyond") return go("skills", { push: false });
  if (screen === "later") return go("beyond", { push: false });
  go(BACK[screen] || "welcome", { push: false });
}
window.addEventListener("popstate", (e) => {
  const to = e.state?.screen;
  if (SCREENS.includes(to)) go(to, { push: false, to: renamedAt(e.state.at || ""), promo: e.state.promo });
});
// Earlier pages in the browser's history still name a job by what it was
// called before its title or employer was fixed; this maps them to the new name.
const renamed = new Map();
function renamedAt(a) {
  if (renamed.has(a)) return renamed.get(a);
  const parts = a.split("\n");
  if (renamed.has(parts[0])) parts[0] = renamed.get(parts[0]);
  return parts.join("\n");
}

// The background questions, in order. Next goes to the next one not yet
// answered or skipped; Back goes to the one before, whatever its state.
const stepIndex = () => (S.steps || []).findIndex((x) => x.id === at);
function nextPending(from) {
  const all = S.steps || [];
  for (let n = from + 1; n < all.length; n++) if (all[n].status === "todo") return all[n];
  return null;
}
// One job at a time: its background questions, then its lines, then
// "anything else", then the job-complete screen, then the next job.
const W = () => S.work || { jobs: [], order: [] };
const jobByKey = (k) => W().jobs.find((j) => j.key === k);
const jobByIndex = (i) => W().jobs[i];
const paidCount = () => W().jobs.filter((j) => !j.outside).length;
function curJob() {
  if (screen === "bg") { const x = (S.steps || [])[stepIndex()]; return x ? jobByIndex(x.job) : null; }
  return jobByKey(at.split("\n")[0]) || null;
}
function jobStart(job, opts = {}) {
  const st = (S.steps || []).find((x) => x.job === job.index && x.status === "todo");
  st ? go("bg", { to: st.id, ...opts }) : go("lines", { to: job.key, ...opts });
}
function nextJob(after) {
  const order = W().order, from = after ? order.indexOf(after.index) : -1;
  const pick = (list) => list.map(jobByIndex).find((j) => j && !j.complete && !j.outside);
  return pick(order.slice(from + 1)) || pick(order.slice(0, Math.max(from, 0)));
}
function resume() {
  const j = nextJob(null), s = nextSection();
  j ? jobStart(j) : s ? go(s) : go("record");
}
function goNext(from) {
  const x = S.steps[from];
  const all = S.steps || [];
  for (let n = from + 1; n < all.length; n++) {
    if (all[n].job !== x.job) break;
    if (all[n].status === "todo") return go("bg", { to: all[n].id });
  }
  go("lines", { to: jobByIndex(x.job).key });
}
function stepBack() {
  const k = stepIndex();
  if (k > 0 && S.steps[k - 1].job === S.steps[k].job) return go("bg", { to: S.steps[k - 1].id, push: false });
  const order = W().order, pos = order.indexOf(S.steps[k]?.job);
  if (pos > 0) return go("end", { to: jobByIndex(order[pos - 1]).key, push: false });
  go("targets", { push: false });
}
function jobBack(job) {
  const mine = (S.steps || []).filter((x) => x.job === job.index);
  if (mine.length) return go("bg", { to: mine[mine.length - 1].id, push: false });
  const order = W().order, pos = order.indexOf(job.index);
  if (pos > 0) return go("end", { to: jobByIndex(order[pos - 1]).key, push: false });
  go("targets", { push: false });
}
const startQuestions = resume;

// An answer is saved a moment after typing stops, and before leaving the
// screen, so Back (on screen or in the browser) never loses it.
function typed(id, text) {
  clearTimeout(draft?.timer);
  draft = { id, text, timer: setTimeout(flush, 800) };
}
function flush() {
  if (!draft) return;
  clearTimeout(draft.timer);
  const d = draft; draft = null;
  if (!d.text.trim()) return;
  return send("POST", "/api/j/answer", { id: d.id, status: "answered", text: d.text })
    .then((r) => { S = { ...S, ...r }; }).catch(() => {});
}

// ---------------------------------------------------------------- screens

function render() {
  const m = $("main");
  if (screen === "signin") return;
  m.innerHTML = ({ welcome, upload, check: () => recordScreen(true), targets, bg, bgdone,
                   lines: linesScreen, line: lineScreen, more: moreScreen, end: endScreen, stopped,
                   record: () => recordScreen(false), edu: eduScreen, skills: skillsScreen,
                   beyond: beyondScreen, later }[screen] || welcome)();
  wire();
}

function welcome() {
  return `
  <div class="stack" style="padding-top:12px">
    <h1 class="big">Build your master career record</h1>
    <p>This tool builds your master career record: every job, accomplishment, skill and credential you have, in one place. You build it once. Every resume and cover letter after that is tailored from it.</p>
    <p>Bring in a resume or LinkedIn file if you have one. Then we go through your jobs one at a time and ask what a good recruiter would ask: what you were brought in to do, what changed because you were there, and how you'd measure it. Education, skills and a short summary come after.</p>
    <p>Why go to the trouble? Most resumes leave out much of what a person has done, because nobody remembers it all while staring at a blank page. The project that saved money and the people you trained win interviews, and they're easy to miss. The right questions bring them back.</p>
    <p>Plan on 15 to 20 minutes a job, over as many sittings as you like. Everything is saved as you go.</p>
    <div style="padding-top:8px"><button class="btn" data-go="upload">Start</button></div>
  </div>`;
}

function upload() {
  const busy = uploads.some((u) => u.busy);
  const anyOk = uploads.some((u) => u.ok);
  const files = uploads.map((u) => `
    <div class="file ${u.ok ? "ok" : u.err ? "err" : ""}">
      <div style="font-weight:600">${u.busy ? '<span class="spin" aria-hidden="true"></span>' : ""}${esc(u.name)}</div>
      <div>${esc(u.msg)}</div>
    </div>`).join("");
  return `
  <div class="stack">
    <h1>Bring in what you have</h1>
    <p class="muted">A resume, a LinkedIn PDF, or both. A second file only adds what's new, so nothing is listed twice.</p>
    ${files}
    <div class="drop" id="drop">
      <div style="font-weight:600">${anyOk ? "Have another file? Drop it here, or choose it" : "Drop a file here, or choose one"}</div>
      <div class="small muted">PDF, Word or plain text, up to 5 MB. You can choose more than one.</div>
      <input type="file" id="files" accept=".pdf,.docx,.txt,.md" multiple hidden>
      <button class="${anyOk ? "btn2" : "btn"}" id="pick" ${busy ? "disabled" : ""}>${anyOk ? "Add another file" : "Choose a file"}</button>
    </div>
    <div>
      <button class="link" id="liTip" aria-expanded="${!!ui.li}">Using LinkedIn? How to save your profile as a PDF</button>
      <ol class="muted" style="margin:4px 0 0;padding-left:22px;font-size:15px" ${ui.li ? "" : "hidden"}>
        <li>Open your LinkedIn profile on a computer.</li>
        <li>Choose Resources (or More) under your name, then Save to PDF.</li>
        <li>Come back here and choose that file.</li>
      </ol>
    </div>
    <div class="row">
      ${anyOk ? `<button class="btn" data-go="check" ${busy ? "disabled" : ""}>Check what we read</button>` : ""}
      <button class="link" data-back>Back</button>
      ${anyOk ? "" : `<button class="link" id="skip" ${busy ? "disabled" : ""}>I don't have a file. Skip this</button>`}
    </div>
  </div>`;
}

function recordScreen(isCheck) {
  const jobs = S.jobs || [];
  const none = !jobs.length;
  const head = isCheck
    ? (none ? `<h1>Your jobs</h1>
         <p class="muted">List your jobs, newest first: the employer, your title and the dates. Include part-time, contract and military work. The detail comes later, one job at a time.</p>`
       : `<h1>Check what we read</h1>
         <p class="muted">Fix anything that's wrong before we start. You can change all of it later too.</p>`)
    : `<h1>Your record</h1>${continueNote()}${targetsCard()}`;
  const counts = none ? "" : `<p class="small muted">${plural(jobs.length, "job")} · ${plural(S.line_count, "line")}</p>`;
  return `
  <div class="stack">
    ${head}
    ${contactCard()}
    ${none ? "" : `<div class="label" style="padding-top:4px">Jobs, newest first</div>${counts}`}
    ${jobs.map(jobCard).join("")}
    ${addJobBlock(none)}
    ${isCheck || !S.skills ? "" : sectionCards()}
    ${undoBar()}
    <div class="row" style="padding-top:4px">
      ${isCheck ? `<button class="btn" data-go="targets" ${none ? "disabled" : ""}>Looks right. Next</button>`
                : `<button class="btn2" data-go="upload">Bring in another file</button>`}
      <button class="link" data-back>Back</button>
    </div>
  </div>`;
}

function contactCard() {
  const c = S.contact || {};
  if (ui.contact) {
    const f = (k, label, type = "text") => `
      <div class="stack-s"><label for="c_${k}">${label}</label>
      <input type="${type}" id="c_${k}" value="${esc(c[k])}" autocomplete="off"></div>`;
    return `<div class="card">
      <div class="label">Contact</div>
      ${f("Name", "Name")}${f("Email", "Email", "email")}${f("Telephone", "Phone")}
      ${f("Location", "City and state or country")}${f("Linkedin", "LinkedIn address")}
      <div class="row"><button class="btn2" id="saveContact">Save</button>
      <button class="link" id="cancelContact">Cancel</button></div></div>`;
  }
  const bits = [c.Email, c.Telephone, c.Location].filter(Boolean).map(esc).join(" · ");
  const empty = !c.Name && !bits;
  return `<div class="card" style="gap:4px">
    <div class="label">Contact</div>
    ${empty ? `<div class="muted">No contact details yet.</div>`
            : `<div style="font-weight:600">${esc(c.Name) || "<span class='muted'>No name yet</span>"}</div>
               ${bits ? `<div class="muted" style="font-size:15px">${bits}</div>` : ""}`}
    <div><button class="link" id="editContact">${empty ? "Add contact details" : "Edit contact details"}</button></div>
  </div>`;
}

function jobCard(j) {
  const i = j.index;
  const open = ui.open === i;
  const n = j.lines.length;
  if (ui.editJob === i) {
    return `<div class="card">
      ${jobFields("e", j)}
      <div class="row"><button class="btn2" data-savejob="${i}">Save</button>
      <button class="link" data-canceljob>Cancel</button></div></div>${titlePrompt(j)}`;
  }
  const lines = j.lines.map((l, k) => ui.editLine === `${i}:${k}`
    ? `<div class="line" style="flex-direction:column;align-items:stretch">
         <label for="el">Edit this line</label>
         <textarea id="el">${esc(l.text)}</textarea>
         <div class="row"><button class="btn2" data-saveline="${i}:${k}">Save</button>
         <button class="link" data-cancelline>Cancel</button></div></div>`
    : `<div class="line"><div>${esc(l.text)}</div>
         <div class="acts"><button class="link tight" data-editline="${i}:${k}">Edit</button>
         <button class="link tight danger" data-delline="${i}:${k}" aria-label="Delete this line">Delete</button></div></div>`).join("");
  const adding = ui.addLine === i
    ? `<div class="stack-s" style="padding-top:8px"><label for="nl">A line for this job</label>
       <textarea id="nl" placeholder="e.g. Trained 6 new hires on the scanning system"></textarea>
       <div class="row"><button class="btn2" data-saveadd="${i}">Add this line</button>
       <button class="link" data-canceladd>Cancel</button></div></div>`
    : `<div><button class="link" data-addline="${i}">Add a line</button></div>`;
  const confirm = ui.confirmDel === i
    ? `<div class="confirm" role="alertdialog" aria-label="Confirm delete">
         <div>Delete ${esc(j.title)} at ${esc(j.employer)}${n ? ` and its ${plural(n, "line")}` : ""}?</div>
         <div class="row"><button class="btn2" data-deljob="${i}">Delete</button>
         <button class="link" data-keepjob>Keep it</button></div></div>` : "";
  return `<div class="card">
    <div class="card-head"><div>${esc(j.title)}, ${esc(j.employer)}</div>
      <div class="dates">${esc(j.dates) || "<span class='muted'>no dates</span>"}</div></div>
    <div class="row" style="gap:16px">
      <button class="link" data-toggle="${i}" aria-expanded="${open}">${open ? "Hide lines" : "Show lines"} (${plural(n, "line")})</button>
      <button class="link" data-editjob="${i}">Edit job</button>
      <button class="link danger" data-askdel="${i}">Delete job</button>
    </div>
    ${confirm}
    ${open ? backgroundBlock(j) : ""}
    ${open ? `<div class="lines">${lines || `<div class="muted small" style="padding:8px 0">No lines yet.</div>`}${adding}</div>` : ""}
  </div>${titlePrompt(j)}`;
}

function backgroundBlock(j) {
  const bg = j.background || [];
  const first = (S.steps || []).find((x) => x.job === j.index && x.kind === "q");
  if (!bg.length && !first) return "";
  return `<div class="stack-s" style="gap:0">
    ${bg.map((b) => `<div class="bgline"><div class="q">${esc(b.question)}</div><div>${esc(b.answer)}</div></div>`).join("")}
    ${first ? `<div><button class="link tight" data-answers="${esc(first.id)}">${bg.length ? "Change these answers" : "Answer the background questions"}</button></div>` : ""}
  </div>`;
}

function targetsCard() {
  const t = S.targets;
  return `<div class="card" style="gap:4px"><div class="label">Jobs you're aiming for</div>
    <div>${t.titles.length ? t.titles.map(esc).join(" · ") : `<span class="muted">${t.status === "not_sure" ? "Not sure yet" : "None yet"}</span>`}</div>
    ${t.where || t.modes.length ? `<div class="muted" style="font-size:15px">${[t.where, ...t.modes].filter(Boolean).map(esc).join(" · ")}</div>` : ""}
    <div><button class="link" data-go="targets">Change</button></div></div>`;
}

function continueNote() {
  const w = W(), n = nextJob(null);
  if (!w.jobs.length) return "";
  return `<div class="done stack-s">
    <div class="count">${w.complete_count} of ${plural(paidCount(), "position")} complete · covers ${w.years.covered} of your ${w.years.total} years</div>
    ${n ? `<div>Next: ${esc(n.title)} at ${esc(n.employer)}.</div>
      <div><button class="btn" id="continueQs">Continue where you left off</button></div>`
      : nextSection() ? `<div>Every job is complete. Next: ${SECTION_NAMES[nextSection()].toLowerCase()}.</div>
        <div><button class="btn" id="continueQs">Continue where you left off</button></div>`
      : `<div>Your jobs, education and skills are all gone through. Your summary comes in the next update.</div>`}
  </div>`;
}

function progress(caption, frac = 0, stage = 0) {
  return `<div class="stack-s" aria-label="Progress">
    <div class="stages">${STAGES.map((st, n) => `<div class="stage ${n === stage ? "on" : ""}">
      <div class="bar"><div style="width:${n < stage ? 100 : n === stage ? Math.round(frac * 100) : 0}%"></div></div>${st}</div>`).join("")}</div>
    ${caption ? `<div class="count">${esc(caption)}</div>` : ""}
  </div>`;
}

function targets() {
  const t = S.targets, full = t.titles.length >= S.max_targets;
  return `${progress("")}
  <div class="stack">
    <h1>What jobs are you aiming for?</h1>
    <p>Up to three job titles. This tells us which skills to suggest and what your sample resume should aim at. You can change it any time, and changing it never removes anything you've entered.</p>
    ${t.suggest.length ? `<div class="stack-s"><div style="font-size:14px;font-weight:600">Titles from your record, tap to add</div>
      <div class="row" style="gap:8px">${t.suggest.map((x) => `<button class="chip add" data-addtarget="${esc(x)}" ${full ? "disabled" : ""}>Add: ${esc(x)}</button>`).join("")}</div></div>` : ""}
    <div class="stack-s"><label for="targetTitle">${t.suggest.length ? "Or type a title" : "Type a title"}</label>
      <div class="row" style="gap:8px;flex-wrap:nowrap"><input type="text" id="targetTitle" placeholder="e.g. Director of Distribution" style="flex:1;min-width:0" ${full ? "disabled" : ""}>
      <button class="btn2" id="addTarget" ${full ? "disabled" : ""}>Add</button></div>
      ${full ? `<div class="small muted">That's three. Remove one to add another.</div>` : ""}</div>
    <div class="card">
      <div class="label">Your targets (${t.titles.length} of ${S.max_targets})</div>
      ${t.titles.length ? t.titles.map((x, n) => `<div class="card-head" style="align-items:center"><div style="font-size:17px">${esc(x)}</div>
        <button class="link tight" data-rmtarget="${n}">Remove</button></div>`).join("") : `<div class="muted">None yet.</div>`}
    </div>
    <div class="stack-s"><label for="targetWhere">Where do you want to work? (optional)</label>
      <input type="text" id="targetWhere" placeholder="e.g. Columbus, Ohio" value="${esc(t.where)}">
      <div class="row" style="gap:8px">${S.work_modes.map((m) => `<button class="chip" data-mode="${esc(m)}" aria-pressed="${t.modes.includes(m)}">${esc(m)}</button>`).join("")}</div></div>
    <div class="row" style="border-top:1px solid var(--line);padding-top:14px">
      <button class="btn" id="saveTargets">${t.titles.length ? "Save. Start with my newest job" : "Start with my newest job"}</button>
      ${t.titles.length ? "" : `<button class="btn2" id="notSure">Not sure yet</button>`}
      <button class="link" data-back>Back</button>
    </div>
    ${t.titles.length ? "" : `<p class="small muted">Not sure yet? We'll work from your current title and ask again when you reach your skills.</p>`}
  </div>`;
}

function bg() {
  let k = stepIndex();
  if (k < 0) {   // the job was deleted or renamed since: start from the next open question
    const n = nextPending(-1);
    if (!n) { setTimeout(() => go("bgdone", { push: false })); return ""; }
    at = n.id; k = stepIndex();
    history.replaceState({ ...history.state, at }, "", "#bg");
  }
  const x = S.steps[k];
  const caption = x.job_number ? `Position ${x.job_number} of ${x.job_total}` : "Beyond paid work";
  const frac = x.job_number ? (x.job_number - 1) / x.job_total : 0;
  const examples = (list) => `<div class="ex"><div style="font-weight:600">For example</div>
    ${list.map((e) => `<div>“${esc(e)}”</div>`).join("")}</div>`;
  const box = `<label for="answer">Your answer</label><textarea id="answer" data-step="${esc(x.id)}">${esc(x.answer)}</textarea>`;
  if (x.kind === "company") {
    return `${progress(caption, frac)}<div class="stack">
      ${jobHead(jobByIndex(x.job))}
      <h1>First, in one line: what did ${esc(x.employer)} do?</h1>
      <p class="muted">${esc(Q.company.help)}</p>
      ${examples(Q.company.examples)}
      ${box}
      <div class="row"><button class="btn" data-answer="answered">Next</button>
      <button class="btn2" data-answer="skipped">Skip</button>
      <button class="link" data-back>Back</button></div></div>`;
  }
  if (x.kind === "titles") {
    const one = x.titles.length === 1;
    const form = ui.promo || ui.titleForm;
    return `${progress(caption, frac)}<div class="stack">
      <div class="small muted">${esc(x.employer)}</div>
      <h1>${ui.promo ? `You mentioned a promotion. What was your title at ${esc(x.employer)} before that?`
                     : `Did your title change while you were at ${esc(x.employer)}, for example a promotion?`}</h1>
      <p class="muted">Promotions are some of the strongest evidence on a resume. Listing each title with its dates shows them.</p>
      <div class="card">
        <div class="label">Your ${one ? "title" : "titles"} at ${esc(x.employer)}</div>
        ${x.titles.map((t) => fixForm(jobByIndex(t.job)) || `<div class="card-head"><div>${esc(t.title)}</div><div class="dates">${esc(t.dates) || "no dates"}</div></div>
          <div style="margin-top:-6px">${fixLink(jobByIndex(t.job)).replace("margin-left:6px", "margin-left:0")}</div>`).join("")}
        <div class="small muted">Your resume will show ${one ? "each title" : "these"} stacked under one ${esc(x.employer)} heading, newest first.</div>
      </div>
      ${form ? `<div class="card">
        <div class="stack-s"><label for="t_title">Title</label><input type="text" id="t_title" placeholder="e.g. Warehouse Associate"></div>
        <div class="stack-s"><label for="t_dates">Dates</label><input type="text" id="t_dates" placeholder="e.g. 2017 to 2018"></div>
        <div class="row"><button class="btn2" id="addTitle">Add this title</button>
        <button class="link" id="cancelTitle">Cancel</button></div></div>` : ""}
      <div class="row"><button class="btn" data-answer="done">${ui.promo && one ? "Skip this" : one ? "No, one title" : "That's all of them"}</button>
      ${form ? "" : `<button class="btn2" id="openTitle">Add a title</button>`}
      <button class="link" data-back>Back</button></div>
      <p class="small muted">Each title gets its own background questions, all optional.</p>
    </div>`;
  }
  const q = Q.questions[x.field];
  return `${progress(caption, frac)}<div class="stack">
    ${jobHead(jobByIndex(x.job))}
    <h1>${esc(q.q)}</h1>
    <p class="muted">${esc(q.help)}</p>
    ${examples(q.examples)}
    ${box}
    <div class="row"><button class="btn" data-answer="answered">Next</button>
    <button class="btn2" data-answer="na">Doesn't apply to this job</button>
    <button class="link" data-back>Back</button></div></div>`;
}

// The job's name and dates at the top of each screen in a job, with a link
// to correct them right there.
function jobHead(j) {
  return fixForm(j) || `<div class="small muted">${esc(j.title)}, ${esc(j.employer)}${j.dates ? ` · ${esc(j.dates)}` : ""}
    ${fixLink(j)}</div>`;
}
const fixLink = (j) => !j ? "" : `<button class="link tight" style="font-size:14px;margin-left:6px" data-fixjob="${j.index}">Fix title or dates</button>`;
function fixForm(j) {
  if (!j || ui.fixJob !== j.index) return "";
  return `<div class="card">
    <div style="font-weight:600">Fix this job's details</div>
    ${jobFields("f", j)}
    <div class="row"><button class="btn2" data-savefix="${j.index}">Save</button>
    <button class="link" data-cancelfix>Cancel</button></div></div>`;
}
function jobCaption(j, extra) {
  if (j.outside) return progress(`Beyond paid work${extra ? " · " + extra : ""}`, 0, 3);
  return progress(`Position ${j.number} of ${j.total}${extra ? " · " + extra : ""}`, (j.number - 1) / j.total);
}
const TAGS = { todo: "To do", skipped: "Skipped for now", stronger: "Stronger", kept: "Kept as is" };
const tag = (st) => `<span class="tag ${st}">${TAGS[st]}</span>`;
const lineOf = (j, key) => j.lines.find((l) => l.key === key);

function linesScreen() {
  const j = curJob();
  if (!j) { setTimeout(() => go("record", { push: false })); return ""; }
  const n = j.lines.length, c = j.counts, done = c.stronger + c.kept;
  const intro = !j.intro_seen;
  const shown = ui.all ? j.lines : j.suggested.map((k) => lineOf(j, k)).filter(Boolean);
  const skipped = j.lines.filter((l) => l.status === "skipped");
  const next = lineOf(j, j.next_line);
  const status = `You've been through all ${plural(n, "line")}: ${[c.stronger ? `${c.stronger} stronger` : "", c.kept ? `${c.kept} kept as ${c.kept === 1 ? "it is" : "they are"}` : "", c.skipped ? `${c.skipped} skipped for now` : ""].filter(Boolean).join(", ")}.`;
  return `${jobCaption(j, `${done} of ${plural(n, "line")} done`)}<div class="stack">
    ${jobHead(j)}
    ${intro ? `<h1>Now we make your resume lines stronger</h1>
      <p>Your resume says what you did. A hiring manager wants to know what it was for and what came of it. For each line we ask four quick questions, then write a stronger version for you to approve. Your original is kept.</p>
      <div class="card"><div class="stack-s" style="gap:2px"><div class="label">Before</div><div>Reduced overtime costs</div></div>
        <div class="stack-s" style="gap:2px"><div class="label" style="color:var(--accent)">After</div><div style="font-weight:600">Cut weekly overtime by about 30% across two warehouses by redesigning shift handoffs</div></div></div>`
      : `<h1>Your lines as ${esc(j.title)}</h1>`}
    ${n ? `<div class="stack-s">
      ${next && !ui.all ? `<div style="font-weight:600">We suggest starting with ${shown.length === 1 ? "this one" : "these"}. Tap any line to work on it, in any order.</div>` : ""}
      ${shown.map((l) => `<button class="pick" data-openline="${esc(l.key)}"><span>${esc(l.text)}</span>${tag(l.status)}</button>`).join("")}
      ${n > shown.length || ui.all ? `<div><button class="link" id="allLines">${ui.all ? "Show the suggested lines" : `Show all ${plural(n, "line")}`}</button></div>` : ""}
    </div>` : `<p class="muted">Your resume had no lines for this job. Add anything you did here on the next screen.</p>`}
    <div class="row">
      ${next ? `<button class="btn" data-openline="${esc(next.key)}">Start with “${esc(next.text.length > 40 ? next.text.slice(0, 38) + "…" : next.text)}”</button>
        <button class="btn2" id="skipLine">Skip for now</button>`
      : `${n ? `<div style="flex-basis:100%;font-weight:600">${status}</div>` : ""}
        <button class="btn" id="toMore">Next: anything else from this job</button>
        ${skipped.length ? `<button class="btn2" data-openline="${esc(skipped[0].key)}">Go back to a skipped line (${skipped.length})</button>` : ""}`}
      <button class="link" data-back>Back</button>
    </div>
    ${next ? `<div class="stack-s" style="gap:2px;border-top:1px solid var(--line);padding-top:6px">
      <div><button class="link" id="linesFine">My lines are fine as they are</button></div>
      <div class="small muted">Keeps every line you haven't worked on exactly as it is, and moves on. ${done} of ${n} done so far.</div></div>` : ""}
    ${undoBar()}
  </div>`;
}

function lineScreen() {
  const [jk, lk] = at.split("\n");
  const j = jobByKey(jk), l = j && lineOf(j, lk);
  if (!l) { setTimeout(() => j ? go("lines", { to: j.key, push: false }) : go("record", { push: false })); return ""; }
  if (!ui.ans) { loadAnswers(j, l); return `<div class="muted">Opening your line…</div>`; }
  const steps = Q.line_steps, a = ui.ans, k = ui.step || 0;
  const head = `${jobCaption(j, "")}
    <div class="stack-s" style="margin-bottom:12px">${jobHead(j)}</div>
    <div class="card"><div class="label">${l.new ? "Your new line" : "Your line"}</div><div class="big">${esc(l.text)}</div>
      <div><button class="link tight" id="why">${ui.why ? "Hide why we ask" : "Why we ask this"}</button></div>
      ${ui.why ? `<p style="font-size:15px">A hiring manager wants to know what this line was for and what came of it. Four quick questions, then we write a stronger version for you to approve. Your original is kept.</p>` : ""}</div>`;
  const leave = `<div class="row" style="gap:16px;border-top:1px solid var(--line);padding-top:6px">
      <button class="link" id="lineKeep">This line is fine as it is</button>
      <button class="link danger" id="lineRemove">Remove this line</button>
      <button class="link" id="jobDone">Mark this job done as it is</button></div>`;
  if (ui.phase === "writing") return `${head}<div class="stack"><div><span class="spin" aria-hidden="true"></span>Writing a stronger version from your answers…</div></div>`;
  if (ui.phase === "empty") return `${head}<div class="stack">
    <h2>Nothing new to add yet</h2>
    <p>You skipped every question, so there's nothing to build a stronger line from. We won't write one without your answers.</p>
    <div class="row"><button class="btn" id="lineKeep">Keep it as it is</button>
    <button class="btn2" id="lineSkip">Skip for now</button>
    <button class="link danger" id="lineRemove">Remove this line</button>
    <button class="link" id="lineBack">Back</button></div></div>`;
  if (ui.phase === "result") {
    const failed = !ui.draft;
    return `${head}<div class="stack">
      <h2>${failed ? "Write it in your own words" : "Here's the stronger line"}</h2>
      <p class="small muted">${failed ? "We couldn't write a version without adding figures you didn't give, so we won't offer one. Edit your line below using your answers." : "Written only from what you told us. Nothing is added that you didn't say."}</p>
      <div class="pair">
        <div class="card" style="min-width:0"><div class="label">Your original (kept)</div><div>${esc(l.text)}</div></div>
        <div class="card strong" style="min-width:0"><div class="label" style="color:var(--accent)">Stronger version</div>
          ${ui.edit || failed ? `<label for="lineEdit">Edit the line</label><textarea id="lineEdit">${esc(ui.draft || l.text)}</textarea>`
                             : `<div style="font-size:17px;font-weight:500">${esc(ui.draft)}</div>`}</div>
      </div>
      <div class="row"><button class="btn" id="approve">Approve</button>
      ${failed ? "" : `<button class="btn2" id="editDraft">${ui.edit ? "Done editing" : "Edit"}</button>`}
      <button class="link" id="lineBack">Back</button></div>
      <p class="small muted">Approving takes you back to your list of lines.</p></div>`;
  }
  const q = steps[k];
  const soFar = steps.filter((x) => a[x.field]).map((x) => `<div style="font-size:15px"><b>${esc(x.label)}:</b> ${esc(a[x.field])}</div>`).join("");
  return `${head}<div class="stack">
    <div class="lsteps">${steps.map((x, n) => `<div class="lstep ${n === k ? "on" : a[x.field] ? "done" : ""}">${esc(x.label)}</div>`).join("")}</div>
    <h2>${esc(q.q)}</h2>
    <p>${esc(q.help)}</p>
    <p class="small muted">For example: “${esc(q.example)}”</p>
    <label for="lans">Your answer</label><textarea id="lans">${esc(a[q.field] || "")}</textarea>
    <div class="row"><button class="btn" id="lineNext">${k === 3 ? "Write the line" : "Next"}</button>
    <button class="btn2" id="lineSkipQ">Not sure, skip</button>
    <button class="link" id="lineBack">Back</button></div>
    ${soFar ? `<div class="done stack-s"><div class="label" style="color:var(--accent-dark)">Your line so far</div>${soFar}</div>` : ""}
    ${leave}
  </div>`;
}

function moreScreen() {
  const j = curJob();
  if (!j) { setTimeout(() => go("record", { push: false })); return ""; }
  ui.items = ui.items || [];
  return `${jobCaption(j, "")}<div class="stack">
    ${jobHead(j)}
    <h1>${j.outside && !j.lines.length ? "What did you do there?" : "Anything else from this job your resume doesn't mention?"}</h1>
    <p class="muted">Tap any that ring a bell. Each one becomes its own line, and we go through it the same way: situation, what you did, result, number.</p>
    <div class="row" style="gap:8px">${Q.chips.map((c) => `<button class="chip" data-chip="${esc(c)}" aria-pressed="${ui.items.includes(c)}">${esc(c)}</button>`).join("")}</div>
    <div class="stack-s"><label for="moreText">Something else? Describe it in a few words</label>
      <textarea id="moreText" style="min-height:72px" placeholder="e.g. trained the night shift on the new scanners"></textarea>
      <div><button class="btn2" id="addMore">Add to the list</button></div></div>
    ${ui.items.length ? `<div class="done stack-s"><div class="label" style="color:var(--accent-dark)">New lines to work through (${ui.items.length})</div>
      ${ui.items.map((x, n) => `<div class="card-head" style="align-items:center"><div style="font-weight:400">${esc(x)}</div><button class="link tight" data-rmitem="${n}">Remove</button></div>`).join("")}</div>` : ""}
    <div class="row">
      ${ui.items.length ? `<button class="btn" id="workMore">Work through these</button>` : ""}
      <button class="${ui.items.length ? "btn2" : "btn"}" id="noMore">${ui.items.length ? "Skip these, finish the job" : "Nothing else. Finish this job"}</button>
      <button class="link" data-back>Back</button>
    </div></div>`;
}

const BG_LABELS = { Challenge: "Brought in to", Authority: "Responsible for",
                    "Results against targets": "Judged on", Recognition: "Recognised" };
function endScreen() {
  const j = curJob();
  if (!j) { setTimeout(() => go("record", { push: false })); return ""; }
  const rec = S.jobs[j.index], bg = rec.background || [];
  const company = bg.find((b) => b.field === "Company");
  const c = j.counts, w = W(), next = nextJob(j);
  const open = c.todo + c.skipped + j.open_questions;
  const shownLines = j.lines.map((l) => `<div class="row" style="gap:10px;align-items:baseline;flex-wrap:nowrap">${tag(l.status)}<span style="min-width:0;font-size:15px">${esc(l.text)}</span></div>`).join("");
  return `${jobCaption(j, "")}<div class="stack">
    <h1>${j.outside ? `${esc(j.title)} is on your record` : `Position ${j.number} of ${j.total} ${j.complete ? "complete" : "nearly complete"}`}</h1>
    <p>${j.outside ? "Here is how it reads on your record. It's optional, so nothing here holds you back, and you can add to it any time." : `Here is how this job now reads on your record.`}${j.outside ? "" : j.complete ? " You can change any of it later." : ` ${plural(open, "thing")} ${open === 1 ? "is" : "are"} left for later; the job counts as complete once ${open === 1 ? "it's" : "they're"} done, or when you mark it done as it is.`}</p>
    <div class="card">
      ${fixForm(j) || `<div><div style="font-size:18px;font-weight:600">${esc(j.title)}</div><div class="muted" style="font-size:15px">${esc(j.employer)}${j.dates ? ` · ${esc(j.dates)}` : ""}</div>
        <div>${fixLink(j).replace("margin-left:6px", "margin-left:0")}</div></div>`}
      ${company ? `<div class="muted" style="font-size:15px;font-style:italic">${esc(company.answer)} (your words)</div>` : ""}
      ${bg.filter((b) => BG_LABELS[b.field]).map((b) => `<div style="font-size:15px"><b>${BG_LABELS[b.field]}:</b> ${esc(b.answer)}</div>`).join("")}
      ${shownLines ? `<div class="stack-s" style="border-top:1px solid var(--line);padding-top:10px">${shownLines}</div>` : ""}
      <div class="count small muted">${plural(c.stronger, "line")} strengthened · ${c.kept} kept as is${c.todo + c.skipped ? ` · ${c.todo + c.skipped} still to do` : ""}</div>
    </div>
    <div class="card" style="gap:4px"><div>Your record covers ${w.years.covered} of your ${w.years.total} years so far. Each job you complete gives every future resume more to draw from.</div></div>
    <div class="row">
      ${j.outside ? `<button class="btn" data-go="beyond">Back to beyond paid work</button>`
        : next ? `<button class="btn" id="nextJob">Next job: ${esc(next.title)}</button>`
        : nextSection() ? `<button class="btn" data-go="${nextSection()}">Next: ${SECTION_NAMES[nextSection()].toLowerCase()}</button>`
        : `<button class="btn" data-go="record">See your record</button>`}
      <button class="btn2" id="stopNow">Stop for now</button>
      ${j.complete ? "" : `<button class="link" id="jobDone">Mark this job done as it is</button>`}
      <button class="link" data-back>Back</button>
    </div></div>`;
}

function stopped() {
  const w = W(), n = nextJob(null);
  const st = n && (S.steps || []).find((x) => x.job === n.index && x.status === "todo");
  return `<div class="stack" style="padding-top:8px">
    <h1>Everything is saved</h1>
    <p>You've completed ${w.complete_count} of your ${plural(paidCount(), "position")}, covering ${w.years.covered} of your ${w.years.total} years. Nothing you've entered will be lost.</p>
    ${n ? `<p>When you come back, we'll pick up where you left off: ${esc(n.title)} at ${esc(n.employer)}, starting with ${st ? "its background questions" : "its lines"}. You can also choose a different job from your record.</p>` : ""}
    <div class="row"><button class="btn" id="continueQs">Keep going now</button>
    <button class="btn2" data-go="record">See your record</button></div></div>`;
}

function bgdone() {
  const all = S.steps || [];
  const jobs = new Set(all.map((x) => x.job)).size;
  const answered = all.filter((x) => x.kind !== "titles" && x.status === "answered").length;
  const left = all.filter((x) => x.status === "todo");
  return `${progress(`${plural(jobs, "job")} · ${plural(answered, "answer")}`, left.length ? 0.9 : 1)}<div class="stack">
    <h1>${left.length ? "Nearly there" : "That's the background for every job"}</h1>
    ${left.length ? `<p>${plural(left.length, "question")} ${left.length === 1 ? "is" : "are"} still open, from a job added along the way.</p>` : ""}
    <p>Your answers are on your record now, under each job. Next comes making your resume lines stronger, one line at a time. That part arrives in the next update.</p>
    <div class="row">
      ${left.length ? `<button class="btn" id="continueQs">Answer ${left.length === 1 ? "it" : "them"}</button>` : ""}
      <button class="${left.length ? "btn2" : "btn"}" data-go="record">See your record</button>
      <button class="link" data-back>Back</button>
    </div></div>`;
}

function titlePrompt(j) {
  if (!j.last_at_employer || j.outside) return "";
  if (ui.addTitle === j.employer) {
    return `<div class="card">
      <div style="font-weight:600">Another title at ${esc(j.employer)}</div>

    <button class="link tight" style="font-size:14px" data-addtitle="${esc(j.employer)}">Add each one with its dates</button></div>`;
}

function jobFields(p, j, noEmployer) {
  return `${noEmployer ? "" : `<div class="stack-s"><label for="${p}_emp">Employer</label>
      <input type="text" id="${p}_emp" value="${esc(j.employer)}"></div>`}
    <div class="stack-s"><label for="${p}_title">Your title</label>
      <input type="text" id="${p}_title" value="${esc(j.title)}"></div>
    <div class="stack-s"><label for="${p}_dates">Dates</label>
      <input type="text" id="${p}_dates" value="${esc(j.dates)}" placeholder="e.g. Mar 2019 to now"></div>`;

function addJobBlock(none) {
  if (ui.addJob || none) {

      <div style="font-weight:600">${none ? "Add a job" : "A job that's missing"}</div>
      ${jobFields("n", { employer: "", title: "", dates: "" })}

function undoBar() {

  return `<div class="toast" role="status"><div style="min-width:0">Deleted “${esc(ui.undo.text)}”</div>

}

// ---------------------------------------------------------------- education, skills, beyond paid work

const SECTION_NAMES = { edu: "Education and licences", skills: "Your skills", beyond: "Beyond paid work" };
const nextSection = () => ["edu", "skills", "beyond"].find((k) => !(S.sections || {})[k]);

function itemUndo() {
  if (!ui.gone) return "";
  return `<div class="toast" role="status"><div style="min-width:0">Deleted “${esc(ui.gone.text)}”</div>

const EDU_FORMS = {
  education: [["degree", "Degree or course", "e.g. BS, or Welding certificate"], ["field", "Field of study", "e.g. Business Administration"],
              ["school", "School", "e.g. Portland State University"],
              ["year", "Year", "e.g. 2009", "Optional. Some people leave the year off older degrees. Your choice."]],
  certifications: [["name", "Name", "e.g. Certified Supply Chain Professional (CSCP)"], ["issuer", "Issued by", "e.g. APICS"],
                   ["year", "Year earned", "e.g. 2019"]],
};
const CURRENT = ["Yes", "No, it lapsed", "Not sure"];

function eduForm(section, e) {
  const f = e ? e.fields : {};
  const id = e ? `${section}:${e.index}` : `new:${section}`;
  if (ui.cur === undefined) ui.cur = f.current || "";
  const inputs = EDU_FORMS[section].map(([k, label, ph, note]) => `<div class="stack-s" style="gap:4px">
      <label for="ef_${k}">${label}</label><input type="text" id="ef_${k}" value="${esc(f[k] || "")}" placeholder="${esc(ph)}">
      ${note ? `<div class="small muted">${note}</div>` : ""}</div>`).join("");
  const more = section === "education"
    ? `<label class="row" style="gap:8px;font-weight:400;font-size:15px"><input type="checkbox" id="ef_studying" ${f.studying ? "checked" : ""}> I'm still studying for this (the year above becomes the expected year)</label>
       <div class="stack-s" style="gap:4px"><label for="ef_extra">Anything worth mentioning from it? (optional)</label>
       <div class="small muted">For example: graduated with honours · thesis on warehouse routing · captain of the debate team · paid my own way working nights</div>
       <textarea id="ef_extra" style="min-height:64px">${esc(f.extra || "")}</textarea></div>`
    : `<div class="stack-s" style="gap:4px"><div style="font-size:14px;font-weight:600">Still current?</div>
       <div class="row" style="gap:8px">${CURRENT.map((c) => `<button class="chip" data-cur="${esc(c)}" aria-pressed="${ui.cur === c}">${c}</button>`).join("")}</div></div>`;
  return `<div class="stack" style="gap:12px;border-top:1px solid var(--soft-line);padding-top:12px">${inputs}${more}
    <div class="row"><button class="btn" data-saveedu="${esc(id)}">Save</button>
    ${e ? `<button class="link danger" data-deledu="${esc(id)}">Delete this</button>` : ""}
    <button class="link" data-closeedu>Cancel</button></div></div>`;
}

function eduScreen() {
  const list = S.edu || [];
  const card = (e) => {
    const id = `${e.section}:${e.index}`, open = ui.eduOpen === id;
    return `<div class="card">
      <div class="card-head" style="align-items:flex-start"><div><div class="label">${e.kind === "degree" ? "Degree or course" : "Licence or certification"}</div>

        ${open ? "" : `<button class="btn2" data-openedu="${esc(id)}">Edit</button>`}</div>
      ${open ? eduForm(e.section, e) : ""}</div>`;
  };
  const adding = ui.eduOpen?.startsWith("new:") ? ui.eduOpen.slice(4) : "";
  return `${progress(`Education · ${plural(list.length, "entry", "entries")}`, 0, 1)}<div class="stack">
    <h1>Education and licences</h1>
    <p>${list.length ? "We found these in your resume. Check each one, fix anything that's wrong, and add anything missing." : "Add any degree, course, licence or certification you have. If you have none, go straight on."} A degree, a trade certificate and a licence all count.</p>
    ${list.map(card).join("")}
    ${adding ? `<div class="card"><div style="font-weight:600">${adding === "education" ? "A degree or course" : "A licence or certification"}</div>${eduForm(adding, null)}</div>` : ""}
    <div class="row">
      <button class="btn2" data-openedu="new:education">+ Add a degree or course</button>
      <button class="btn2" data-openedu="new:certifications">+ Add a licence or certification</button>
    </div>
    <div class="row">
      <button class="btn" id="eduDone">${list.length ? "These are right. On to skills" : "Nothing to add. On to skills"}</button>
      <button class="link" data-back>Back</button>
    </div>
    ${itemUndo()}
  </div>`;
}

const LEVEL_HELP = [["Expert", "others come to you for it; you could teach it."],
                    ["Advanced", "you handle hard problems with it on your own."],
                    ["Working", "you use it regularly and sometimes look things up."],
                    ["Familiar", "you've used it and would need a refresher."]];

function skillItem(k) {
  const fix = ui.fixSkill === k.name;
  const use = k.state === "yes" ? (fix
    ? `<div class="row" style="gap:8px;align-items:flex-end">
        <div class="stack-s" style="gap:4px;flex:1;min-width:100px"><label for="sk_years">Years used</label><input type="text" id="sk_years" value="${esc(k.years)}" placeholder="e.g. 6"></div>
        <div class="stack-s" style="gap:4px;flex:1;min-width:100px"><label for="sk_last">Last used</label><input type="text" id="sk_last" value="${esc(k.last_used)}" placeholder="e.g. 2024, or now"></div>
        <button class="btn2" data-saveuse="${esc(k.name)}">Save</button><button class="link" data-canceluse>Cancel</button></div>`
    : `<div class="small muted">${k.use ? esc(k.use) + " " : ""}<button class="link tight" style="font-size:14px" data-fixuse="${esc(k.name)}">${k.use ? "Correct this" : "Add years used"}</button></div>`) : "";
  const body = k.state === "yes"
    ? `<div class="row" style="gap:6px"><span class="small muted">Level:</span>${S.skills.levels.map((l) =>
        `<button class="chip" style="min-height:36px;padding:6px 10px;font-size:14px" data-level="${esc(k.name)}" data-l="${l}" aria-pressed="${k.level === l}">${l}</button>`).join("")}</div>
       <div><button class="link tight danger" data-have="${esc(k.name)}" data-h="no">I don't have this</button></div>`
    : k.state === "ask"
    ? `<div class="row"><button class="btn2" data-have="${esc(k.name)}" data-h="yes">I have this</button>
       <button class="btn2" data-have="${esc(k.name)}" data-h="no">No</button></div>`
    : `<div class="small muted">Not on your resumes. Kept here so we don't suggest it again. <button class="link tight" style="font-size:14px" data-have="${esc(k.name)}" data-h="yes">I do have it</button></div>`;
  return `<div class="card" style="gap:6px;padding:12px 14px${k.state === "no" ? ";opacity:.8" : ""}">
    <div class="card-head"><div>${esc(k.name)}</div><span class="tag ${k.state === "yes" ? "kept" : k.state === "ask" ? "todo" : ""}">${esc(k.tag)}</span></div>
    ${k.shown ? `<div class="small muted">${esc(k.shown)}</div>` : ""}${use}${body}</div>`;
}

function skillsScreen() {
  const k = S.skills, t = S.targets, full = t.titles.length >= S.max_targets;
  if (k.needs_build && !ui.building && !ui.buildErr) setTimeout(buildSkills);
  const open = ui.skOpen || [];
  const groups = k.groups.map((g) => {
    const asks = g.items.filter((x) => x.state === "ask"), show = open.includes(g.cat);
    const items = g.items.filter((x) => show || x.state !== "ask");
    if (!items.length && !asks.length) return "";
    return `<div class="stack-s"><h2 style="font-size:20px">${esc(g.cat)}</h2>
      ${items.map(skillItem).join("")}
      ${asks.length ? `<div><button class="link" data-skopen="${esc(g.cat)}">${show ? "Hide suggested skills" : `Show ${plural(asks.length, "suggested skill")} for this group`}</button></div>` : ""}</div>`;
  }).join("");
  const basis = k.basis.length ? _and(k.basis) : "your field";
  return `${progress(`Skills · ${k.mine} listed as yours · ${k.unrated} without a level`, 0, 2)}<div class="stack">
    <h1>Your skills</h1>
    <p>Skills from your resume and your record are listed as yours. We've added skills that are common for ${esc(basis)}; mark the ones you have. Set a level for any you like; a skill without a level still counts as yours.</p>
    <div class="card" style="gap:8px">
      <div class="label">Skills for the jobs you're aiming for (${t.titles.length} of ${S.max_targets})</div>
      ${t.titles.length ? t.titles.map((x, n) => `<div class="card-head" style="align-items:center"><div>${esc(x)}</div><button class="link tight" data-rmtarget="${n}">Remove</button></div>`).join("")
        : `<div style="font-size:15px">None yet, so we've gone by your current role${k.current ? `, ${esc(k.current)}` : ""}. Add a title to get the skills those jobs ask for.</div>`}
      ${full ? "" : ui.skTarget ? `<label for="skTitle">Type any job title</label>
        <div class="row" style="flex-wrap:nowrap"><input type="text" id="skTitle" placeholder="e.g. Director of Distribution" style="flex:1;min-width:0"><button class="btn2" id="addSkTarget">Add</button></div>
        ${t.suggest.length ? `<div class="small muted">Or tap one from your record:</div><div class="row" style="gap:8px">${t.suggest.map((x) => `<button class="chip add" data-addtarget="${esc(x)}">Add: ${esc(x)}</button>`).join("")}</div>` : ""}`
        : `<div><button class="link tight" id="openSkTarget">Add a title</button></div>`}
      <div class="small muted">Each title you add brings in the skills postings for it usually ask for. Nothing you've already answered changes.</div>
    </div>
    <div class="note">List only skills you have. Anything here can appear on a resume, and an interviewer may ask you to show it.</div>
    <div class="stack-s" style="gap:4px;font-size:15px"><div style="font-weight:600">What the levels mean</div>
      ${LEVEL_HELP.map(([l, d]) => `<div><b>${l}:</b> ${d}</div>`).join("")}</div>
    ${ui.building ? `<div class="done"><span class="spin" aria-hidden="true"></span>Finding the skills postings for ${esc(basis)} usually ask for…</div>` : ""}
    ${ui.buildErr ? `<div class="note">${esc(ui.buildErr)} <button class="link tight" id="retryBuild">Try again</button></div>` : ""}
    ${k.groups.length ? `<p class="muted">These are skills job postings in your field usually ask for. Add any we missed at the bottom.</p>` : ""}
    ${groups}
    <div class="stack-s"><label for="newSkill">Add a skill we missed</label>
      <div class="row" style="flex-wrap:nowrap"><input type="text" id="newSkill" placeholder="e.g. Power BI" style="flex:1;min-width:0"><button class="btn2" id="addSkill">Add</button></div></div>
    <div class="row">
      <button class="btn" id="skillsDone">Done with skills${k.unanswered ? ` (${plural(k.unanswered, "suggestion")} left unanswered, not used)` : ""}</button>
      <button class="link" data-back>Back</button>
    </div>
  </div>`;
}
const _and = (a) => a.length === 1 ? a[0] : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];

  { key: "volunteer", label: "Volunteering", hint: "Treated like a job", job: true,

  { key: "membership", label: "Board or membership", hint: "Organisation, role, years",

  { key: "training", label: "Training or course", hint: "Course, provider, year",

  { key: "talk", label: "Talk or publication", hint: "Title, where, year",
    fields: [["name", "Title", "e.g. Cross-training to cut peak overtime"], ["where", "Where", "e.g. Regional logistics conference"], ["year", "Year", "e.g. 2023"]] },
  { key: "break", label: "Career break", hint: "Dates, optional reason",
    fields: [["from", "From", "e.g. 2016"], ["to", "To", "e.g. 2017"], ["reason", "Reason, if you'd like to give one", "e.g. Caring for a parent, study, travel"]],

function beyondScreen() {
  const b = S.beyond, n = b.items.length + b.jobs.length;
  const tile = TILES.find((x) => x.key === ui.tile);

    ? `<div class="card"><label for="itemText">${esc(it.kind)}</label><textarea id="itemText" style="min-height:64px">${esc(it.text)}</textarea>
       <div class="row"><button class="btn2" data-saveitem="${it.section}:${it.index}">Save</button><button class="link" data-cancelitem>Cancel</button></div></div>`
    : `<div class="card" style="gap:4px"><div class="label">${esc(it.kind)}</div><div>${esc(it.text)}</div>
       <div class="row" style="gap:16px"><button class="link tight" data-edititem="${it.section}:${it.index}">Edit</button>
       <button class="link tight danger" data-delitem="${it.section}:${it.index}">Delete</button></div></div>`;
  const jobRow = (j) => `<div class="card" style="gap:4px"><div class="label">${esc(j.kind)}</div><div>${esc(j.title)}, ${esc(j.employer)}${j.dates ? ` · ${esc(j.dates)}` : ""}</div>

    ${n ? `<div class="stack-s"><div class="label">On your record</div>${b.jobs.map(jobRow).join("")}${b.items.map(item).join("")}</div>` : ""}
    <div class="tiles">${TILES.map((x) => `<button class="tile" data-tile="${x.key}" aria-pressed="${ui.tile === x.key}"><span style="font-weight:600">${x.label}</span><span class="small">${x.hint}</span></button>`).join("")}</div>
    ${tile ? `<div class="card"><h2 style="font-size:20px">${tile.label}</h2>
      ${tile.fields.map(([k, label, ph]) => `<div class="stack-s" style="gap:4px"><label for="tf_${k}">${label}</label><input type="text" id="tf_${k}" placeholder="${esc(ph)}"></div>`).join("")}
      ${tile.note ? `<p class="small muted">${tile.note}</p>` : ""}

    <div class="row">
      <button class="btn" id="beyondDone">${n ? "Done with this part" : "Nothing to add. Finish"}</button>
      <button class="link" data-back>Back</button>
    </div>
    ${itemUndo()}
  </div>`;
}

function later() {
  const w = W();
  return `${progress("", 1, 4)}<div class="stack" style="padding-top:8px">
    <h1>That's your record gone through</h1>
    <p>Your jobs, education, skills and anything outside paid work are on your record. ${w.complete_count} of your ${plural(paidCount(), "position")} ${w.complete_count === 1 ? "is" : "are"} complete, covering ${w.years.covered} of your ${w.years.total} years.</p>

    <div class="row"><button class="btn" data-go="record">See your record</button><button class="link" data-back>Back</button></div></div>`;

  const k = S.skills, b = S.beyond;

const val = (id) => ($(id)?.value || "").trim();
const job = (i) => S.jobs[i];
const lineAt = (key) => { const [i, k] = key.split(":").map(Number); return [i, k, job(i).lines[k]]; };

function wire() {
  on("[data-go]", (el) => go(el.dataset.go));
  on("[data-back]", back);
  if (screen === "upload") wireUpload();
  if (screen === "check" || screen === "record") wireRecord();
  if (screen === "targets") wireTargets();
  if (screen === "bg") wireBg();

  if (screen === "line") wireLine();

// Fixing a job's title, employer or dates from inside the job. Saving keeps
// the same question or line on screen, whatever the job is now called.
function wireFix() {
  // Whatever is half-typed on the screen is saved first and stays in its box.
  const boxes = ["answer", "lans", "moreText"];
  const restore = () => boxes.forEach((id) => { if ($(id) && ui.typed?.[id] != null) $(id).value = ui.typed[id]; });
  on("[data-fixjob]", async (el) => {
    ui.typed = Object.fromEntries(boxes.filter((id) => $(id)).map((id) => [id, $(id).value]));
    await flush();
    if (screen === "line" && ansTimer) {
      clearTimeout(ansTimer); ansTimer = null;
      const j = curJob(); await saveAnswers(j, lineOf(j, at.split("\n")[1]));
    }
    ui.fixJob = +el.dataset.fixjob; render(); restore(); $("f_title")?.focus();
  });
  on("[data-cancelfix]", () => { ui.fixJob = null; render(); restore(); });
  on("[data-savefix]", (el) => act(async () => {
    const i = +el.dataset.savefix;
    const x = screen === "bg" ? S.steps[stepIndex()] : null;
    const before = { key: jobByIndex(i)?.key, steps: S.steps || [] };
    const r = await send("PATCH", `/api/j/jobs/${i}`, { expect: job(i).label,
      employer: val("f_emp"), title: val("f_title"), dates: val("f_dates") });
    S = { ...S, ...r };
    const map = [[before.key, jobByIndex(i)?.key], ...before.steps.map((y) =>
      [y.id, S.steps.find((z) => z.job === y.job && z.kind === y.kind && z.field === y.field)?.id])];
    map.forEach(([o, n]) => { if (o && n && o !== n) {
      renamed.forEach((v, k) => { if (v === o) renamed.set(k, n); });
      renamed.set(o, n);
    } });
    ui.fixJob = null;
    if (x) {
      const same = S.steps.find((y) => y.job === x.job && y.kind === x.kind && y.field === x.field);
      if (same) at = same.id;
    } else if (jobByIndex(i)) {
      const parts = at.split("\n"); parts[0] = jobByIndex(i).key; at = parts.join("\n");
    }
    history.replaceState({ ...history.state, at }, "", location.hash);
    send("PUT", "/api/j/step", { screen, at }).catch(() => {});
    return r;
  }).then(restore));
}

async function loadAnswers(j, l) {
  try {
    ui.ans = await send("POST", "/api/j/line/answers/get", lineBody(j, l));
    ui.step = Q.line_steps.findIndex((x) => !ui.ans[x.field]);
    if (ui.step < 0) ui.step = 0;
    if (ui.ans.draft) { ui.phase = "result"; ui.draft = ui.ans.draft; }
  } catch (e) { ui.ans = {}; ui.step = 0; }
  render();
}

let ansTimer = null;
function saveAnswers(j, l) {
  clearTimeout(ansTimer);
  const answers = {}; Q.line_steps.forEach((x) => answers[x.field] = ui.ans[x.field] || "");
  return send("POST", "/api/j/line/answers", lineBody(j, l, { answers })).catch(() => {});
}

function wireLine() {
  const [jk, lk] = at.split("\n");
  const j = jobByKey(jk), l = j && lineOf(j, lk);
  if (!l || !ui.ans) return;
  const box = $("lans");
  const field = Q.line_steps[ui.step || 0].field;
  if (box) box.oninput = () => { ui.ans[field] = box.value.trim(); clearTimeout(ansTimer); ansTimer = setTimeout(() => saveAnswers(j, l), 800); };
  if ($("why")) $("why").onclick = () => { ui.why = !ui.why; render(); };
  const toList = () => go("lines", { to: j.key });
  const status = (st) => act(async () => { const r = await send("POST", "/api/j/line/status", lineBody(j, l, { status: st })); S = { ...S, ...r }; toList(); });
  const advance = async (keep) => {
    if (box) ui.ans[field] = keep ? box.value.trim() : "";
    if (!keep && box) box.value = "";
    await saveAnswers(j, l);
    if ((ui.step || 0) < 3) { ui.step = (ui.step || 0) + 1; render(); window.scrollTo(0, 0); return; }
    if (!Q.line_steps.some((x) => ui.ans[x.field])) { ui.phase = "empty"; return render(); }
    ui.phase = "writing"; render();
    try {
      const r = await send("POST", "/api/j/line/stronger", lineBody(j, l));
      if (r.empty) { ui.phase = "empty"; } else { ui.phase = "result"; ui.draft = r.line; ui.edit = false; }
    } catch (e) { ui.phase = null; say(e.message); }
    render();
  };
  if ($("lineNext")) $("lineNext").onclick = () => advance(true);
  if ($("lineSkipQ")) $("lineSkipQ").onclick = () => advance(false);
  if ($("lineBack")) $("lineBack").onclick = () => {
    if (ui.phase) { ui.phase = null; ui.step = 3; return render(); }
    if ((ui.step || 0) > 0) { ui.step--; return render(); }
    back();
  };
  if ($("lineKeep")) $("lineKeep").onclick = () => status("kept");
  if ($("lineSkip")) $("lineSkip").onclick = () => status("skipped");
  if ($("lineRemove")) $("lineRemove").onclick = () => act(async () => {
    const r = await send("POST", "/api/j/line/remove", lineBody(j, l));
    S = { ...S, ...r }; toList();
    ui.undo = { i: j.index, label: S.jobs[j.index].label, ...r.deleted }; render();
  });
  if ($("jobDone")) $("jobDone").onclick = () => act(async () => {
    const r = await send("POST", "/api/j/job/mark", { job: j.key, what: "done" }); S = { ...S, ...r }; go("end", { to: j.key }); });
  if ($("editDraft")) $("editDraft").onclick = () => { if (ui.edit) ui.draft = val("lineEdit") || ui.draft; ui.edit = !ui.edit; render(); };
  if ($("approve")) $("approve").onclick = () => act(async () => {
    const text = $("lineEdit") ? val("lineEdit") : ui.draft;
    const r = await send("POST", "/api/j/line/approve", lineBody(j, l, { text }));
    S = { ...S, ...r }; toList();
  });
}

async function readFiles(files) {
  if (!files.length || uploads.some((u) => u.busy)) return;
  say("");
  const mine = files.map((f) => ({ name: f.name, busy: true,
    msg: "Waiting its turn." }));
  uploads.push(...mine);
  render();
  for (let n = 0; n < files.length; n++) {
    const u = mine[n];
    u.msg = "Reading it and checking every line against your file. This can take a minute; keep this page open.";
    render();
    const slow = setTimeout(() => { u.msg = "Still reading. A longer resume takes more time; keep this page open."; render(); }, 45000);
    try {
      const fd = new FormData(); fd.append("file", files[n]);
      const r = await api("/api/j/import", { method: "POST", body: fd });
      S = { ...S, ...r };
      const first = !mine.slice(0, n).some((x) => x.ok) && !uploads.slice(0, -mine.length).some((x) => x.ok);
      const parts = [];
      if (first && r.jobs.length && r.new_jobs === r.jobs.length) {
        parts.push(`Found ${plural(r.jobs.length, "job")} and ${plural(r.line_count, "resume line")}. Next you'll check them.`);
      } else if (r.new_jobs || r.new_lines) {
        parts.push(`Added ${[r.new_jobs ? plural(r.new_jobs, "new job") : "", r.new_lines ? plural(r.new_lines, "new line") : ""].filter(Boolean).join(" and ")}. Everything else was already on your record.`);
      } else {
        parts.push("Nothing new in this one: everything in it is already on your record.");
      }
      if (r.left_out_deleted) parts.push(`${plural(r.left_out_deleted, "thing")} you deleted or reworded earlier ${r.left_out_deleted === 1 ? "was" : "were"} left out.`);
      if (r.set_aside) parts.push(`${plural(r.set_aside, "line")} couldn't be matched to the file word for word, so ${r.set_aside === 1 ? "it was" : "they were"} left out rather than risk changing your words.`);
      Object.assign(u, { busy: false, ok: true, msg: parts.join(" ") });
    } catch (e) {
      Object.assign(u, { busy: false, err: true,
        msg: e.message === "signed out" ? "Sign in, then choose the file again." : e.message });
    } finally { clearTimeout(slow); }
    render();
  }
}

// ---------------------------------------------------------------- sign-in

function signIn() {
  screen = "signin";
  $("main").innerHTML = `<div class="stack" style="padding-top:12px">
    <h1>Sign in</h1>
    <div class="stack-s"><label for="email">Email</label><input type="email" id="email" autocomplete="email"></div>
    <div class="stack-s"><label for="code">Invite code, if you were given one</label><input type="text" id="code"></div>
    <div><button class="btn" id="login">Sign in</button></div></div>`;
  $("login").onclick = async () => {
    say("");
    try {
      await send("POST", "/dev/login", { email: val("email"), code: val("code") });
      boot();
    } catch (e) { say(e.message); }
  };
}

async function boot() {
  try {
    [S, Q] = await Promise.all([api("/api/j/state"), api("/api/j/questions")]);
  } catch (e) { if (e.message !== "signed out") say(e.message); return; }
  const fromHash = location.hash.slice(1);
  const h = history.state || {};
  const kept = SCREENS.includes(fromHash) && h.screen === fromHash;
  screen = kept ? fromHash : S.screen;
  at = (kept ? h.at : S.step.at) || "";
  ui = { promo: kept && !!h.promo };
  history.replaceState({ screen, at, promo: ui.promo, depth: h.depth || 0 }, "", "#" + screen);
  render();
}
boot();

  const saveTargets = (titles) => act(async () => {
    const r = await send("PUT", "/api/j/targets", { titles, where: t().where, modes: t().modes });
    ui.skTarget = false; ui.buildErr = ""; return r;
  });
  const add = (x) => { if (x && t().titles.length < S.max_targets) saveTargets([...t().titles, x]); };
  if ($("openSkTarget")) $("openSkTarget").onclick = () => { ui.skTarget = true; render(); $("skTitle")?.focus(); };
  if ($("addSkTarget")) $("addSkTarget").onclick = () => add(val("skTitle"));
  if ($("skTitle")) $("skTitle").onkeydown = (e) => { if (e.key === "Enter") add(val("skTitle")); };
  on("[data-addtarget]", (el) => add(el.dataset.addtarget));
  on("[data-rmtarget]", (el) => saveTargets(t().titles.filter((_, n) => n !== +el.dataset.rmtarget)));
  if ($("retryBuild")) $("retryBuild").onclick = () => { ui.buildErr = ""; buildSkills(); };
  on("[data-skopen]", (el) => { const c = el.dataset.skopen, o = ui.skOpen || [];
    ui.skOpen = o.includes(c) ? o.filter((x) => x !== c) : [...o, c]; render(); });
  on("[data-level]", (el) => { const k = el.dataset.level, l = el.dataset.l,
    cur = S.skills.groups.flatMap((g) => g.items).find((x) => x.name === k);
    act(() => sec("/api/j/skill", { name: k, level: cur && cur.level === l ? "" : l })); });
  on("[data-have]", (el) => act(() => sec("/api/j/skill", { name: el.dataset.have, have: el.dataset.h })));
  on("[data-fixuse]", (el) => { ui.fixSkill = el.dataset.fixuse; render(); $("sk_years")?.focus(); });
  on("[data-canceluse]", () => { ui.fixSkill = null; render(); });
  on("[data-saveuse]", (el) => act(async () => {
    const r = await sec("/api/j/skill", { name: el.dataset.saveuse, years: val("sk_years"), last_used: val("sk_last") });
    ui.fixSkill = null; return r;
  }));
  const addSkill = () => { const n = val("newSkill"); if (n) act(() => sec("/api/j/skill/add", { name: n })); };
  $("addSkill").onclick = addSkill;
  $("newSkill").onkeydown = (e) => { if (e.key === "Enter") addSkill(); };
  $("skillsDone").onclick = () => finishSection("skills", "beyond");
}

function wireBeyond() {
  const item = (id) => { const [s, i] = id.split(":"); return S.beyond.items.find((x) => x.section === s && x.index === +i); };
  on("[data-tile]", (el) => { ui.tile = ui.tile === el.dataset.tile ? null : el.dataset.tile; ui.gone = null; render();
    document.querySelector("[id^=tf_]")?.focus(); });
  if ($("closeTile")) $("closeTile").onclick = () => { ui.tile = null; render(); };
  if ($("saveTile")) $("saveTile").onclick = () => act(async () => {
    const tile = TILES.find((x) => x.key === ui.tile);
    const fields = Object.fromEntries(tile.fields.map(([k]) => [k, val(`tf_${k}`)]));
    if (tile.job) {
      const r = await sec("/api/j/joblike", { name: tile.key, fields });
      S = { ...S, ...r }; ui.tile = null;
      const j = jobByIndex(r.result);
      if (j) go("more", { to: j.key });
      return r;
    }
    const r = await sec("/api/j/tile", { name: tile.key, fields });
    ui.tile = null; return r;
  });
  on("[data-edititem]", (el) => { ui.editItem = el.dataset.edititem; render(); $("itemText")?.focus(); });
  on("[data-cancelitem]", () => { ui.editItem = null; render(); });
  on("[data-saveitem]", (el) => act(async () => {
    const it = item(el.dataset.saveitem);
    const r = await sec("/api/j/item/edit", { section: it.section, index: it.index, expect: it.text, text: val("itemText") });
    ui.editItem = null; return r;
  }));
  on("[data-delitem]", (el) => act(async () => {
    const it = item(el.dataset.delitem);
    const r = await sec("/api/j/item/delete", { section: it.section, index: it.index, expect: it.text });
    ui.gone = r.result; return r;
  }));
  on("[data-gojob]", (el) => go("lines", { to: el.dataset.gojob }));
  wireUndoItem();
  $("beyondDone").onclick = () => finishSection("beyond");
}
</script>
</body>
</html>
